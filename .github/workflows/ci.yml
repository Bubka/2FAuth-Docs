name: ci

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ci.yml
      - docs/**
      - retype.yml
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - docs/**
      - retype.yml

jobs:
  retype-build:
    name: Retype build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: retypeapp/action-build@latest

      - uses: retypeapp/action-github-pages@latest
        with:
          branch: main
          directory: public
          update-branch: true
